version: '3.8'

services:
  cyber-ops-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: behavioral_drift_dashboard
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - HEADLESS_TEST=1
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
